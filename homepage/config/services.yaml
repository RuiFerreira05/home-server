---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/

- Control Group:
    - Homepage Container:
        icon: homepage.png
        href: "https://dashboard.home.lan"
        description: "Dashboard Control Center"
        server: my-docker
        container: homepage
        showStats: true

    - Dockge:
        icon: dockge.svg
        href: "https://dockge.home.lan"
        description: "Docker Management Center"
        server: my-docker
        container: dockge
        showStats: true

    - Portainer:
        icon: portainer.svg
        href: "https://portainer.home.lan"
        description: "Docker Management Center but with a suit"
        server: my-docker
        container: portainer
        showStats: true
        widget:
          type: portainer
          url: "https://portainer:9443"
          env: 3
          key: {{HOMEPAGE_VAR_PORTAINER_KEY}}

    - Watchtower:
        icon: watchtower.svg
        description: "that's a big tower of watches"
        server: my-docker
        container: watchtower
        showStats: true
        widget:
          type: watchtower
          url: "http://watchtower:8080"
          key: {{HOMEPAGE_VAR_WATCHTOWER_KEY}}

    - Scrutiny:
        icon: scrutiny.svg
        href: "https://scrutiny.home.lan"
        description: "This drive is not very SMART"
        server: my-docker
        container: scrutiny
        showStats: true
        widget:
          type: scrutiny
          url: "http://scrutiny:8080"

- Network Group:
    - Pi-hole:
        icon: pi-hole.svg
        href: "https://pihole.home.lan/admin"
        description: "The DNS sink with a hole"
        server: my-docker
        container: pihole
        showStats: true
        widget:
          type: pihole
          url: http://pihole
          version: 6 # required if running v6 or higher, defaults to 5
          key: "{{HOMEPAGE_VAR_PIHOLE_KEY}}" # optional, in v6 can be your password or app password

    - Nginx Proxy Manager:
        icon: nginx-proxy-manager.svg
        href: "https://npm.home.lan"
        description: "Reverse proxy with a big name"
        server: my-docker
        container: nginx-proxy-manager
        showStats: true
        widget:
          type: npm
          url: http://nginx-proxy-manager:81
          username: {{HOMEPAGE_VAR_NPM_USER}}
          password: {{HOMEPAGE_VAR_NPM_PASSWORD}}

    - Tailscale:
        icon: tailscale.svg
        href: "https://login.tailscale.com/admin/machines"
        description: "Tailwi... i mean... Tailscale"
        widget:
          type: tailscale
          deviceid: {{HOMEPAGE_VAR_TAILSCALE_DEVICEID}}
          key: {{HOMEPAGE_VAR_TAILSCALE_KEY}}

- Other Services:
    - Filebrowser Quantum:
        icon: filebrowser-quantum.svg
        href: "https://browse.home.lan"
        description: "browse the homework folder"
        server: my-docker
        container: filebrowser
        showStats: true

    - Jellyfin:
        icon: jellyfin.svg
        href: "https://jellyfin.home.lan"
        description: "For gelatinous media"
        server: my-docker
        container: jellyfin
        showStats: true
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: {{HOMEPAGE_VAR_JELLYFIN_KEY}}
          enableBlocks: true # optional, defaults to false
          enableNowPlaying: true # optional, defaults to true
          enableUser: true # optional, defaults to false
          enableMediaControl: true # optional, defaults to true
          showEpisodeNumber: true # optional, defaults to false
          expandOneStreamToTwoRows: true # optional, defaults to true

    - immich:
        icon: immich.svg
        href: "https://immich.home.lan"
        description: "So we german now?"
        server: my-docker
        container: immich_server
        showStats: true
        widget:
          type: immich
          url: http://immich_server:2283
          key: {{HOMEPAGE_VAR_IMMICH_KEY}}
          version: 2

    - Open-webUI:
        icon: open-webui
        href: "https://open-webui.home.lan"
        description: "Exclusively for AI Slop"
        server: my-docker
        container: open-webui
        showStats: true

    - CloudBeaver:
        icon: cloudbeaver
        href: "https://cloudbeaver.home.lan"
        description: "They fly now!?"
        server: my-docker
        container: cloud-beaver
        showStats: true

    - Marimo:
        icon: marimo.svg
        href: "https://marimo.home.lan"
        description: "like jupyter notebooks, but good"
        server: my-docker
        container: marimo
        showStats: true

- Amaral stuff:
    - Shelfmark:
        icon: https://pb.dashboardicons.com/api/files/community_gallery/x37y8dqzpfbnx47/shelfmark_hm0p7f7i8e.png
        href: "https://shelfmark.home.lan"
        description: "search for smut"
        server: my-docker
        container: shelfmark
        showStats: true

    - AudioBookShelf:
        icon: audiobookshelf.svg
        href: "https://audiobookshelf.home.lan"
        description: "listen to smut"
        server: my-docker
        container: audiobookshelf
        showStats: true
        widget:
          type: audiobookshelf
          url: http://audiobookshelf:80
          key: {{HOMEPAGE_VAR_AUDIOBOOKSHELF_KEY}}

    - Grimmory:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/grimmory.svg
        href: "https://grimmory.home.lan"
        description: "read smut"
        server: my-docker
        container: grimmory
        showStats: true
        widget:
          type: booklore
          url: http://grimmory:6060
          username: {{HOMEPAGE_VAR_BOOKLORE_USER}}
          password: {{HOMEPAGE_VAR_BOOKLORE_PASSWORD}}

- "*Arrs Group":
    - qBittorrent:
        icon: qbittorrent.svg
        href: "https://qbittorrent.home.lan"
        description: "The ol' faithful"
        server: my-docker
        container: qbittorrent
        showStats: true
        widget:
          type: qbittorrent
          url: http://qbittorrent:8080
          username: {{HOMEPAGE_VAR_QBITTORRENT_USER}}
          password: {{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}
          enableLeechProgress: true # optional, defaults to false
          enableLeechSize: true # optional, defaults to false

    - Radarr:
        icon: radarr.svg
        href: "https://radarr.home.lan"
        description: "ping... ping..."
        server: my-docker
        container: radarr
        showStats: true

          url: http://prowlarr:9696
          key: {{HOMEPAGE_VAR_PROWLARR_KEY}}

    - Sonarr:
        icon: sonarr.svg
        href: "https://sonarr.home.lan"
        description: "Like radarr but with more anime"
        server: my-docker
        container: sonarr
        showStats: true
